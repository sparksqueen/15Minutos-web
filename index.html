<!doctype html>
<html lang="es-AR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#211413">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>15 Minutos</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css?v=20261118-15">
  <script defer src="15minutos-20261118-r8.js" id="game-script" onerror="this.dataset.loadFailed = 'true'"></script>
</head>
<body>
  <main id="viewport" aria-label="15 Minutos" aria-busy="true">
    <div id="stage">
      <canvas id="world" tabindex="-1" aria-label="Escenario. Usá flechas o WASD para caminar, espacio para interactuar y G para llevar objetos. Usá los botones del HUD para Mapa, Pendientes y Ajustes."></canvas>
      <div id="ui"></div>
    </div>
    <output id="loading" role="status">Cargando…</output>
    <button type="button" id="fullscreen-button" class="screen-button" aria-label="Pantalla completa" title="Pantalla completa" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2">
        <path class="screen-enter" d="M9 4H4v5m11-5h5v5M4 15v5h5m11-5v5h-5"/>
        <path class="screen-exit" d="M4 9h5V4m6 0v5h5M4 15h5v5m6 0v-5h5"/>
      </svg>
    </button>
    <p id="fullscreen-help" class="fullscreen-help" role="status" hidden></p>
    <div id="rotate-screen" class="rotate-screen" hidden>
      <p id="mobile-run-message" role="status"></p>
      <button type="button" id="mobile-run" class="wood-button">Jugar en pantalla completa</button>
    </div>
    <div id="touch-controls" class="touch-controls" role="group" aria-label="Controles táctiles" hidden>
      <div id="touch-stick" class="touch-stick" role="img" aria-label="Joystick de movimiento">
        <span aria-hidden="true" class="touch-stick-thumb"></span>
      </div>
      <div class="touch-actions">
        <button type="button" id="touch-carry" class="wood-button">Agarrar</button>
        <button type="button" id="touch-interact" class="wood-button">Interactuar</button>
      </div>
    </div>
    <button type="button" id="touch-skip" class="wood-button touch-skip" hidden>Saltar intro</button>
  </main>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const viewport = document.getElementById("viewport");
      if (viewport.dataset.started === "true") return;
      viewport.setAttribute("aria-busy", "false");
      const script = document.getElementById("game-script");
      document.getElementById("loading").textContent = script.dataset.loadFailed === "true"
        ? "No se pudo cargar 15minutos-20261118-r8.js. Tiene que estar en la misma carpeta que index.html."
        : "El juego no pudo arrancar. Revisá el error en la consola del navegador.";
    });
  </script>
</body>
</html>
